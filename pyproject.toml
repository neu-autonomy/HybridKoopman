[project]
name = "hybrid-koopman"
version = "1.0.0"
description = "Hybrid Koopman operator learning: SDP-informed deep Koopman networks"
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy", "scipy", "pandas", "matplotlib"]

[project.optional-dependencies]
video = ["imageio", "imageio-ffmpeg"]
wandb = ["wandb"]
test = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hybrid_koopman"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
